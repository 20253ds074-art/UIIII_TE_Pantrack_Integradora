spring.application.name=servidor-panaderia

# Puerto donde se levanta la API (la app de Android se conecta a este puerto)
server.port=8080

# ---------------- Conexion a MySQL (en mi propia computadora) ----------------
# localhost:3306 es MySQL instalado en esta computadora, no necesita internet.
# createDatabaseIfNotExist=true crea la base "panaderia" si todavia no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/panaderia?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# update: Spring crea las tablas automaticamente a partir de las clases del paquete "modelo"
# y las actualiza si agregamos campos (no borra datos).
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola las consultas SQL que se ejecutan (sirve para revisar)
spring.jpa.show-sql=true
